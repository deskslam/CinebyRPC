<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cineby RPC</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --accent: #e50914;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #17181c; --fg: #f3f4f6; --muted: #9ca3af; --line: #2b2d33; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 300px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--fg);
      }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: #3ba55d; }
      .dot.warn { background: #faa61a; }
      .dot.bad { background: #d83c3c; }
      main { padding: 12px 14px; display: grid; gap: 12px; }
      .muted { color: var(--muted); }
      .now {
        display: grid; gap: 2px; padding: 10px; border: 1px solid var(--line);
        border-radius: 8px; background: color-mix(in srgb, var(--fg) 4%, transparent);
      }
      .now strong { font-size: 13px; }
      .now span { color: var(--muted); font-size: 12px; }
      label { display: flex; align-items: center; gap: 8px; }
      footer { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <span id="statusText">Checking…</span>
    </header>
    <main>
      <div id="nowWrap" class="now" hidden>
        <strong id="nowTitle">—</strong>
        <span id="nowSub">—</span>
      </div>
      <div id="nothing" class="muted">Nothing playing on Cineby right now.</div>

      <label>
        <input type="checkbox" id="enabled" />
        Rich Presence enabled
      </label>

      <div id="hint" class="muted" hidden></div>
    </main>
    <footer>
      Needs the Cineby RPC helper installed and the Discord desktop app open.
      The helper starts on its own when you open a Cineby tab.
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
